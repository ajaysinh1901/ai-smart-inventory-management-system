# Keep-Alive — pings the Render backend every 10 minutes so the free-tier
# web service never sleeps (Render free sleeps after 15 min of inactivity,
# then takes ~30-50 s to wake up — bad for a live demo).
#
# How it works:
#   - Triggers on a 10-minute cron (GitHub-hosted runners — fully free).
#   - Hits /api/v1/health on the backend.
#   - Fails the workflow if the response isn't 200 (so you'll see a red dot
#     on the Actions tab the moment the BE breaks).
#
# Setup:
#   In the GitHub repo → Settings → Secrets and variables → Actions → New
#   repository variable named `RENDER_BACKEND_URL` with value e.g.
#       https://smartstock-api.onrender.com
#   (no trailing slash, no /api/v1).
#
# Cost: $0. GitHub Actions is free for public repos (and gives 2000 min/mo
# for private). 10-min cron × 24 h × 30 days ≈ 4320 runs/mo, ~10 s each,
# well within free quotas.

name: Keep-Alive Backend

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:          # manual trigger button

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /api/v1/health
        env:
          BACKEND_URL: ${{ vars.RENDER_BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::RENDER_BACKEND_URL repo variable is not set. See .github/workflows/keepalive.yml header for setup."
            exit 1
          fi
          echo "Pinging $BACKEND_URL/api/v1/health"
          # Render's free service can take up to 50 s to wake from sleep,
          # so we allow generous retries.
          for attempt in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 60 "$BACKEND_URL/api/v1/health" || echo "000")
            echo "Attempt $attempt: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Response:"
              cat /tmp/body
              echo ""
              exit 0
            fi
            sleep 10
          done
          echo "::error::Backend did not return 200 after 5 attempts"
          exit 1
