<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{width:980px;height:420px;background:#fff;padding:24px}
.title{text-align:center;font-size:20px;font-weight:700;color:#1f3864;margin-bottom:24px}
.wrap{display:flex;align-items:center;justify-content:center;gap:0}
.app{width:190px;text-align:center}
.app .box{border:2px solid #1f3864;border-radius:10px;padding:18px 10px;font-size:14px;font-weight:600;color:#1f3864}
.app .s{font-size:11.5px;color:#666;margin-top:6px}
.conn{width:150px;text-align:center;color:#2e5f9e;font-size:11.5px;font-weight:600}
.conn .a{font-size:24px;display:block}
.cluster{border:2px dashed #2e5f9e;border-radius:12px;padding:16px 18px;background:#f7faff}
.cluster .ct{text-align:center;font-size:13px;font-weight:700;color:#1f3864;margin-bottom:12px}
.nodes{display:flex;gap:12px}
.node{border:1.5px solid #1f3864;border-radius:8px;padding:12px 14px;text-align:center;background:#fff}
.node .t{font-size:13px;font-weight:700;color:#1f3864}
.node .r{font-size:11px;color:#2e5f9e;margin-top:3px}
.cap{text-align:center;font-size:13px;color:#444;margin-top:24px;font-style:italic}
</style></head><body>
<div class="title">MongoDB Atlas Cluster</div>
<div class="wrap">
  <div class="app"><div class="box">Application Server<div class="s">Node.js + Mongoose</div></div></div>
  <div class="conn"><span class="a">&#10142;</span>connection string<br>(secure)</div>
  <div class="cluster">
    <div class="ct">Replica Set (Cluster)</div>
    <div class="nodes">
      <div class="node"><div class="t">Primary</div><div class="r">read &amp; write</div></div>
      <div class="node"><div class="t">Secondary</div><div class="r">replica</div></div>
      <div class="node"><div class="t">Secondary</div><div class="r">replica</div></div>
    </div>
  </div>
</div>
<div class="cap">The server connects to a managed cluster; data is replicated across nodes for availability.</div>
</body></html>
